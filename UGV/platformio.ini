; PlatformIO Project Configuration File
; (Giu nguyen phan goc, chi them khoi "micro-ROS" o cuoi)

[env:genericSTM32H750VB]
platform = ststm32
board = genericSTM32H750VB
framework = stm32cube

board_build.mcu = stm32h750vbt6
board_build.f_cpu = 480000000L
upload_port=/dev/ttyACM0
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

; ================= micro-ROS qua USB CDC (them moi) =================
; Project goc build voi -nostdlib (khong co libc). micro-ROS can newlib
; (malloc, string, ...) nen bo -nostdlib va dung -nostartfiles de van
; dung startup file/linker script cua project.
build_unflags = -nostdlib
build_flags =
    -nostartfiles
    -specs=nano.specs
    -specs=nosys.specs
    -I$PROJECT_DIR/third_party/microros/include
    -I$PROJECT_DIR/include/usb_mw
    -L$PROJECT_DIR/third_party/microros
    -lmicroros
